<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Core</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="voiceUi" aria-label="Voice controls">
      <div id="assistantStateBadge" data-state="IDLE">
        <span id="assistantStateDot" aria-hidden="true"></span>
        <span id="assistantStateLabel">Ready</span>
      </div>
      <div id="voiceControls">
        <button id="micButton" type="button" aria-label="Hold to talk">
          Hold to talk
        </button>
        <button id="wakeButton" type="button" aria-label="Toggle wake word mode" title="Toggle wake word mode">
          Wake
        </button>
        <button id="micSettingsButton" type="button" aria-label="Microphone settings" title="Microphone settings">
          Mic
        </button>
        <button
          id="meetingButton"
          type="button"
          aria-label="Meeting"
          aria-expanded="false"
          aria-controls="meetingPanel"
          title="Record and save a meeting"
        >
          Meeting
        </button>
      </div>
      <div id="micSettingsPanel" hidden>
        <label for="micDeviceSelect">Microphone test device</label>
        <div id="micDeviceControls">
          <select id="micDeviceSelect"></select>
          <button id="micRefreshButton" type="button">Refresh</button>
          <button id="micTestButton" type="button">Test</button>
        </div>
        <div id="micDeviceHint"></div>
      </div>
      <div id="voiceStatus" aria-live="polite"></div>
      <div id="voiceTranscript" aria-live="polite"></div>
      <div id="assistantResponse" aria-live="polite"></div>
    </div>
    <section id="meetingPanel" aria-label="Meeting" hidden>
      <div id="meetingHead">
        <span id="meetingHeading">Meeting</span>
        <span id="meetingChip" data-tone="info">Not started</span>
        <button id="meetingClose" type="button" aria-label="Close the meeting panel">&times;</button>
      </div>
      <form id="meetingForm" autocomplete="off">
        <label for="meetingCode">Launch code</label>
        <input id="meetingCode" name="launch-code" type="password" autocomplete="new-password" spellcheck="false" />
        <label for="meetingTitleInput">Title <span class="optional">(optional)</span></label>
        <input id="meetingTitleInput" name="title" type="text" maxlength="120" autocomplete="off" />
        <button id="meetingStart" type="submit">Start meeting</button>
      </form>
      <div id="meetingLive" hidden>
        <div id="meetingPartial" aria-hidden="true"></div>
        <ol id="meetingLines" aria-live="polite" aria-relevant="additions"></ol>
        <div id="meetingCounts"></div>
        <button id="meetingStop" type="button" data-primary="true">Stop and save</button>
      </div>
      <p id="meetingMessage" role="status" aria-live="polite" data-tone="info"></p>
      <div id="meetingActions"></div>
    </section>
    <div id="latencyFooter" hidden aria-hidden="true"></div>
    <pre id="voiceDebugPanel" hidden aria-label="Voice debug"></pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
