# Numz-Assistant full stack (audio + API + Vite + HTTPS)
#
# Usage:
#   ./scripts/docker-up.sh          # stop host services, build & start
#   docker compose down             # stop containers
#   docker compose logs -f api web  # tail logs
#
# Requires: .env and .env.secrets (AI_API_KEY)

services:
  audio:
    build:
      context: .
      dockerfile: docker/audio/Dockerfile
    container_name: numz-audio
    env_file:
      - .env
    environment:
      AUDIO_HOST: "0.0.0.0"
      AUDIO_PORT: "8765"
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper-cache:/root/.cache/huggingface
      - ./audio/transcribe.py:/app/transcribe.py:ro
      - ./audio/server.py:/app/server.py:ro
    restart: unless-stopped
    networks:
      - numz

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: numz-api
    env_file:
      - .env
      - .env.secrets
    environment:
      NODE_ENV: development
      PORT: "3002"
      AUDIO_SERVICE_URL: http://audio:8765
      AUDIO_SERVICE_TIMEOUT_MS: ${AUDIO_SERVICE_TIMEOUT_MS:-60000}
    volumes:
      - ./server:/app/server:ro
    depends_on:
      audio:
        condition: service_healthy
    ports:
      - "3002:3002"
    restart: unless-stopped
    networks:
      - numz

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: numz-web
    env_file:
      - .env
    environment:
      PORT: "3002"
      API_PROXY_TARGET: http://api:3002
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - numz

  caddy:
    image: caddy:2-alpine
    container_name: numz-https
    depends_on:
      - web
    ports:
      - "443:443"
    volumes:
      - ./docker/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - ./docker/certs:/certs:ro
    restart: unless-stopped
    networks:
      - numz

networks:
  numz:
    name: numz-assistant

volumes:
  whisper-cache:
  web_node_modules:
