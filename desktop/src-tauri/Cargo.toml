[package]
name = "numz-ai-desktop"
version = "0.2.0"
description = "NUMZ AI as a desktop app: the NUMZ AI site in a native window, plus native screenshots."
edition = "2021"
publish = false

[workspace]
members = ["crates/numz-capture"]

[lib]
name = "numz_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
numz-capture = { path = "crates/numz-capture" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# the generated app context reads the plugin settings of tauri.conf.json with it
serde_json = "1"
tauri = { version = "2", features = [] }
# Updates: the app asks for a new version, shows the person a line, and installs it only if the download is signed with the key whose public half is in tauri.conf.json.
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
