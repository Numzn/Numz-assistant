# Builds the NUMZ AI desktop app for Windows on GitHub's own Windows machine, tests it there, tries one real capture on that machine's
# desktop, and keeps the installer as a downloadable file. Nothing is published or signed: the installer is for the person who runs it.
#
# Run it: push to the branch below, or Actions -> "Desktop app (Windows)" -> Run workflow. Download from the run's "Artifacts".
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    branches: [feature/desktop-windows-build, fix/windows-capture-border]
    paths:
      - .github/workflows/desktop-windows.yml
      - desktop/**

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri

      # The capture library's own tests, including the scan that fails if anything that could send input or move focus appears.
      - name: Tests (the whole Rust workspace, on Windows)
        run: cargo test --workspace

      # Windows draws a yellow outline around what is captured, which flashed at the screen's edge. The capture code now asks for none.
      # This holds a capture open with the outline defaulted, required and not required (and a Desktop Duplication session, which has none), photographs the screen the plain way meanwhile
      # (not with the code under test) and counts yellow pixels along the screen's edge.
      - name: Does Windows draw the outline?
        continue-on-error: true
        run: |
          cargo build --quiet -p numz-capture --example borderprobe
          mkdir -p ../../probe
          pwsh -File ../scripts/edge-yellow.ps1 ../../probe/border-idle.png "no capture running" | tee ../../probe/border.log
          for mode in default with none dxgi; do
            ./target/debug/examples/borderprobe.exe $mode 16 > ../../probe/border-$mode.log 2>&1 &
            sleep 6
            pwsh -File ../scripts/edge-yellow.ps1 ../../probe/border-$mode.png "capture open, outline: $mode" | tee -a ../../probe/border.log
            wait
            cat ../../probe/border-$mode.log | tee -a ../../probe/border.log
          done

      # The first time the Windows capture code runs anywhere: ask it what it supports, which windows it sees, and for one picture of the
      # screen. This machine's desktop is a virtual one, so a failure here may be the runner and not the code: the log says which.
      - name: Capture probe on the Windows desktop
        continue-on-error: true
        run: |
          mkdir -p ../../probe
          {
            echo "== support";  cargo run --quiet -p numz-capture --example shot -- support
            echo "== windows";  cargo run --quiet -p numz-capture --example shot -- windows
            echo "== screen";   cargo run --quiet -p numz-capture --example shot -- screen ../../probe/screen.png
          } 2>&1 | tee ../../probe/probe.log

      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis

      # GitHub's machines cannot look up numz.site through their own resolver (the reach-check workflow shows lookups time out), so this
      # runner is told the site's address by hand. Only this throw-away machine's hosts file is touched.
      - name: Tell this runner where the site is
        shell: pwsh
        working-directory: .
        run: |
          $ip = (Resolve-DnsName lab.numz.site -Server 8.8.8.8 -Type A | Where-Object { $_.Type -eq 'A' } | Select-Object -First 1).IPAddress
          "resolved via 8.8.8.8: $ip"
          if ($ip) { Add-Content -Path "$env:windir\System32\drivers\etc\hosts" -Value "$ip lab.numz.site" }

      # Starts the app that was just built, as a person would, waits for it to load the live NUMZ AI page in Windows' own web view, and
      # photographs the desktop and the app's own window with the capture code under test. Then closes it.
      - name: Launch the built app and look at it
        continue-on-error: true
        run: |
          mkdir -p ../../probe
          ./target/release/numz-ai-desktop.exe &
          sleep 35
          shot() { cargo run --quiet -p numz-capture --example shot -- "$@"; }
          { echo "== windows with the app open"; shot windows; } 2>&1 | tee ../../probe/with-app.log
          shot screen ../../probe/with-app-screen.png
          ID=$(shot windows | awk -F'\t' '$2 ~ /NUMZ AI/ { print $1; exit }')
          echo "app window id: ${ID:-none}" | tee -a ../../probe/with-app.log
          if [ -n "$ID" ]; then shot window "$ID" ../../probe/app-window.png 2>&1 | tee -a ../../probe/with-app.log; fi
          taskkill //IM numz-ai-desktop.exe //F || true

      - name: Collect
        run: |
          mkdir -p ../../out
          cp target/release/bundle/nsis/*.exe ../../out/
          cp target/release/numz-ai-desktop.exe ../../out/NUMZ-AI-portable.exe
          ls -la ../../out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: numz-ai-desktop-windows
          path: out/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-capture-probe
          path: probe/
          retention-days: 30
          if-no-files-found: warn
